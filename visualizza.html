<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizza Transazioni - Budget Management</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .remove-button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }
        .remove-button:hover {
            background-color: #c0392b;
        }
        .mese {
            display: inline-block;
            text-align: center;
            margin: 10px;
        }
        .mese span {
            display: block;
            margin-top: 5px;
        }

        /* Stile per abilitare lo scroll verticale solo nella tabella */
        #transazioni-table-wrapper {
            width: 100%;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        #transazioni-table {
            width: 100%;
            border-collapse: collapse;
        }

        #transazioni-table th, #transazioni-table td {
            padding: 8px;
            text-align: left;
            border: 1px solid #ddd;
        }

        /* Aggiungi uno stile per i pulsanti mese */
        .mese a {
            text-decoration: none;
            color: #2c3e50;
            font-weight: bold;
        }

        .mese a:hover {
            color: #2980b9;
        }
    </style>
</head>
<body class="visualizza-page">
    <div class="container">
        <h1>Storico Transazioni</h1>
        
        <!-- Visualizzazione per mese -->
        <div id="mesi-container">
            <!-- I mesi e i relativi importi verranno aggiunti qui tramite JavaScript -->
        </div>

        <!-- Wrapper per la tabella, con scroll abilitato -->
        <div id="transazioni-table-wrapper">
            <table id="transazioni-table">
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Categoria</th>
                        <th>Descrizione</th>
                        <th>Importo</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Le righe della tabella verranno aggiunte tramite JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Totale -->
        <div id="totale">
            <h2>Totale: <span id="totale-amount">€ 0.00</span></h2>
        </div>

        <!-- Link per tornare alla pagina principale -->
        <a href="index.html" class="back-button">INDIETRO</a>
    </div>

    <script>
        // Funzione per aggiornare la tabella e il patrimonio per mese
        function aggiornaTabella() {
            const tableBody = document.querySelector('#transazioni-table tbody');
            const mesiContainer = document.getElementById('mesi-container');
            const transactions = JSON.parse(localStorage.getItem('transactions')) || [];
            const spesePerMese = Array(12).fill(0);  // Array per memorizzare le spese per mese

            // Pulisci la tabella e i mesi
            tableBody.innerHTML = '';
            mesiContainer.innerHTML = '';

            // Aggiungi le righe alla tabella
            transactions.forEach((transazione, index) => {
                const importo = parseFloat(transazione.importo);
                const data = new Date(transazione.data);
                const mese = data.getMonth(); // Ottieni il mese dalla data (0-11)

                // Aggiungi l'importo alle spese per il mese corrispondente
                spesePerMese[mese] += importo;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${transazione.data}</td>
                    <td>${transazione.categoria}</td>
                    <td>${transazione.descrizione || '-'}</td>
                    <td>${importo >= 0 ? `€ ${importo.toFixed(2)}` : `€ -${Math.abs(importo).toFixed(2)}`}</td>
                    <td><button class="remove-button" data-index="${index}">Rimuovi</button></td>
                `;
                tableBody.appendChild(row);
            });

            // Aggiorna la visualizzazione per mese
            const mesiNomi = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
            mesiNomi.forEach((mese, index) => {
                const meseDiv = document.createElement('div');
                meseDiv.classList.add('mese');
                meseDiv.innerHTML = ` 
                    <a href="dettaglio_mese.html?mese=${index}">
                        <strong class="mese-nome">${mese}</strong>
                    </a>
                    <span>€ ${spesePerMese[index].toFixed(2)}</span>
                `;
                mesiContainer.appendChild(meseDiv);
            });


            // Calcola il totale netto (entrate - uscite)
            let totaleEntrate = 0;
            let totaleUscite = 0;
            transactions.forEach(transazione => {
                const importo = parseFloat(transazione.importo);
                if (importo >= 0) {
                    totaleEntrate += importo;
                } else {
                    totaleUscite += importo;
                }
            });
            const totaleNetto = totaleEntrate + totaleUscite;
            document.getElementById('totale-amount').textContent = `€ ${totaleNetto.toFixed(2)}`;
        }

        // Funzione per rimuovere una transazione
        function rimuoviTransazione(index) {
            let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
            transactions.splice(index, 1); // Rimuove la transazione all'indice specificato
            localStorage.setItem('transactions', JSON.stringify(transactions));
            aggiornaTabella(); // Ricarica la tabella aggiornata
        }

        // Gestisce il clic sui pulsanti di rimozione
        document.addEventListener('DOMContentLoaded', () => {
            aggiornaTabella(); // Popola la tabella all'inizio

            document.querySelector('#transazioni-table').addEventListener('click', event => {
                if (event.target && event.target.classList.contains('remove-button')) {
                    const index = event.target.getAttribute('data-index');
                    rimuoviTransazione(index);
                }
            });
        });
    </script>
</body>
</html>
